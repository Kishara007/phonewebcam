[package]
name = "phonewebcam-bridge"
version = "1.0.0"
description = "Lightweight Windows Virtual Camera & Mic Bridge for PhoneWebcam"
authors = ["Kishara Dilshan"]
license = "MIT"
edition = "2021"

[lib]
name = "phonewebcam_bridge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.15"
libloading = "0.8"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "z"
strip = true
